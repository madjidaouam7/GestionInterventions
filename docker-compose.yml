
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gestioninterventions-api:1.1
    container_name: siyana-api
    restart: unless-stopped
    env_file:
      - docker-api.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "127.0.0.1:5084:8080"
    volumes:
      - gestioninterventions-data:/app/data
      - siyana-uploads:/app/wwwroot/uploads
    networks:
      - siyana-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: gestioninterventions-web:1.0
    container_name: siyana-web
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Api__BaseUrl: http://siyana-api:8080/
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - api
    networks:
      - siyana-network

volumes:
  gestioninterventions-data:
    external: true
  siyana-uploads:
    external: true

networks:
  siyana-network:
    external: true
